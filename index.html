<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebAR</title>
    <script type="module" src="/src/main.js"></script>
    <style>
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #ui button {
            position: absolute;
            pointer-events: auto;
        }

        .btn{
            border: none;
            font-size: 16px;
            padding: 10px;
            font-weight: 700;
        }

        #colorButton {
            left: 20px;
            bottom: 100px;
            color: #732e33;
            background-color: #C0D6EE;
        }

        #modelButton {
            right: 20px;
            bottom: 100px;
            color: #830626;
            background-color: #FCDCDD;
        }

        #rotateButton {
            bottom: 50px;
            right: 20px;
            color: #CC6540;
            background-color: #EFE1CE;
        }

        #startButton {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #E0F5EE;
            background-color: #886144;
        }

        #ui[hidden] {
            display: none !important;
        }
        #status {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <button id="startButton" class="btn">Начать AR</button>
    <div id="ui" hidden>
        <button id="colorButton" class="btn">Изменить цвет</button>
        <button id="modelButton" class="btn">Сменить модель</button>
        <button id="rotateButton" class="btn">Вращать модель</button>
    </div>
    <div id="status">Загрузка...</div>

</body>

</html>
