<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebAR</title>
    <script type="module" src="/src/main.js"></script>
    <style>
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #ui button {
            position: absolute;
            pointer-events: auto;
        }

        .btn{
            border: none;
            font-size: 16px;
            color: rgb(64 64 64);
        }

        #colorButton {
            left: 20px;
            bottom: 100px;
        }

        #modelButton {
            right: 20px;
            bottom: 100px;
        }

        #rotateButton {
            bottom: 50px;
            left: 50%;
        }
        #ui[hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <button id="startButton" class="btn">Начать AR</button>
    <div id="ui">
        <button id="colorButton" class="btn">Изменить цвет</button>
        <button id="modelButton" class="btn">Сменить модель</button>
        <button id="rotateButton" class="btn">Вращать</button>
    </div>
    <div id="status"></div>

</body>

</html>
