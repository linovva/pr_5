<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: none; }
    </style>
</head>
<body>
    <button id="ar-button">START AR</button>

    <script type="module">
        import * as THREE from "https://esm.sh/three@0.180.0";
        import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

        // --- Сцена Three.js ---
        const scene = new THREE.Scene();
        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(1, 3, 2);
        scene.add(light);

        const camera = new THREE.PerspectiveCamera();
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.xr.enabled = true;
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Загрузка модели (замените MODEL.glb) ---
        let model;
        new GLTFLoader().load("model.glb", g => {
            model = g.scene;
            model.visible = false;
            model.scale.setScalar(0.2);
            scene.add(model);
        });

        // --- Кружочек-маркер ---
        const marker = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.1, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        marker.rotation.x = -Math.PI / 2;
        marker.visible = false;
        scene.add(marker);

        let hit, space;

        // --- Показ кнопки, если WebXR AR поддерживается ---
        const arButton = document.getElementById('ar-button');
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (supported) {
                    arButton.style.display = 'block';
                    arButton.onclick = startWebXR;
                } else {
                    console.warn("immersive-ar не поддерживается");
                }
            });
        } else {
            console.warn("WebXR не поддерживается");
        }

        // --- Запуск AR-сессии ---
        async function startWebXR() {
            const session = await navigator.xr.requestSession("immersive-ar", {
                requiredFeatures: ["hit-test", "local-floor"]
            });
            renderer.xr.setSession(session);

            space = await session.requestReferenceSpace("local-floor");
            const viewerSpace = await session.requestReferenceSpace("viewer");
            hit = await session.requestHitTestSource({ space: viewerSpace });

            // Тап по экрану — ставим модель на маркер
            session.addEventListener("select", () => {
                if (marker.visible && model) {
                    model.position.copy(marker.position);
                    model.visible = true;
                    marker.visible = false;
                }
            });
        }

        // --- Цикл рендеринга ---
        renderer.setAnimationLoop((_, frame) => {
            if (frame && hit) {
                const results = frame.getHitTestResults(hit);
                if (results.length) {
                    const pose = results[0].getPose(space);
                    const p = pose.transform.position;
                    marker.position.set(p.x, p.y, p.z);
                    if (!model?.visible) marker.visible = true;
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
