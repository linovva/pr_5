<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: none; }
    </style>
</head>
<body>
    <!-- Кнопка для Android (WebXR) -->
    <button id="ar-button">START AR</button>

    <!-- Ссылка для iOS (Quick Look). Замените MODEL.usdz на ваш файл -->
    <a id="quick-look" rel="ar" href="Sheep.usdz" style="display:none; position:fixed; top:20px; left:20px; z-index:10;">
        <img src="POSTER.png" width="200" alt="View in AR">
    </a>

    <script type="module">
        import * as THREE from "https://esm.sh/three@0.180.0";
        import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

        // --- Настройка сцены Three.js (используется только для WebXR) ---
        const scene = new THREE.Scene();
        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(1, 3, 2);
        scene.add(light);

        const camera = new THREE.PerspectiveCamera();
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.xr.enabled = true;
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Загрузка 3D-модели ---
        let model;
        new GLTFLoader().load("MODEL.glb", g => {
            model = g.scene;
            model.visible = false;
            model.scale.setScalar(0.2);
            scene.add(model);
        });

        // --- Маркер (кольцо) для указания места размещения ---
        const marker = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.1, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        marker.rotation.x = -Math.PI / 2;
        marker.visible = false;
        scene.add(marker);

        // --- Переменные для WebXR ---
        let hit, space;

        // --- Определение платформы и показ соответствующей кнопки ---
        const arButton = document.getElementById('ar-button');
        const quickLookLink = document.getElementById('quick-look');

        // 1. Проверяем iOS Quick Look (Safari)
        if (quickLookLink.relList.supports('ar')) {
            quickLookLink.style.display = 'block';
        }
        // 2. Проверяем WebXR (Android Chrome и др.)
        else if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (supported) {
                    arButton.style.display = 'block';
                    arButton.onclick = startWebXR;
                }
            });
        }

        // --- Запуск WebXR-сессии (только для Android) ---
        async function startWebXR() {
            const session = await navigator.xr.requestSession("immersive-ar", {
                requiredFeatures: ["hit-test", "local-floor"]
            });
            renderer.xr.setSession(session);

            // Получаем системы координат для hit-test
            space = await session.requestReferenceSpace("local-floor");
            const viewerSpace = await session.requestReferenceSpace("viewer");
            hit = await session.requestHitTestSource({ space: viewerSpace });

            // По тапу размещаем модель на маркере
            session.addEventListener("select", () => {
                if (marker.visible && model) {
                    model.position.copy(marker.position);
                    model.visible = true;
                    marker.visible = false;
                }
            });
        }

        // --- Цикл рендеринга (работает и в обычном режиме, и в WebXR) ---
        renderer.setAnimationLoop((_, frame) => {
            if (frame && hit) {
                const results = frame.getHitTestResults(hit);
                if (results.length) {
                    const pose = results[0].getPose(space);
                    const position = pose.transform.position;
                    marker.position.set(position.x, position.y, position.z);
                    if (!model?.visible) marker.visible = true;
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
